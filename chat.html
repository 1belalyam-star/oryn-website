<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Oryn — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #050810;
    --surface: #0c1120;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --white: #f0eeea;
    --muted: #6b7280;
    --border: #1a2035;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Syne', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 3D Canvas Background */
  #three-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Header */
  .header {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: rgba(5,8,16,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #c9a84c22;
    box-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .back-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: #c9a84c18; border: 1px solid #c9a84c33;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 16px; cursor: pointer;
    text-decoration: none; transition: all 0.2s;
  }
  .back-btn:hover { background: #c9a84c30; }
  .oryn-badge {
    display: flex; align-items: center; gap: 10px;
  }
  .oryn-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #c9a84c, #8a6a20);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 20px #c9a84c44, 0 0 40px #c9a84c22;
    animation: iconPulse 3s ease-in-out infinite;
  }
  .oryn-info { display: flex; flex-direction: column; }
  .oryn-name { font-size: 15px; font-weight: 800; color: var(--gold-light); letter-spacing: 1px; }
  .oryn-status { font-size: 10px; color: #4ade80; letter-spacing: 1px; display: flex; align-items: center; gap: 4px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; animation: blink 2s infinite; }

  /* Mode Tabs */
  .mode-tabs {
    position: relative; z-index: 10;
    display: flex; gap: 6px;
    padding: 10px 16px;
    background: rgba(5,8,16,0.7);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #1a2035;
    overflow-x: auto;
  }
  .mode-tabs::-webkit-scrollbar { display: none; }
  .mode-tab {
    padding: 7px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
    border: 1px solid var(--border);
    color: var(--muted); background: transparent;
    cursor: pointer; white-space: nowrap;
    transition: all 0.25s ease;
    font-family: 'Syne', sans-serif;
  }
  .mode-tab.active {
    background: var(--gold);
    color: #050810;
    border-color: var(--gold);
    box-shadow: 0 0 16px #c9a84c55;
  }
  .mode-tab:not(.active):hover {
    border-color: var(--gold);
    color: var(--gold-light);
  }

  /* Messages */
  .messages {
    flex: 1; overflow-y: auto;
    padding: 20px 16px;
    position: relative; z-index: 5;
    display: flex; flex-direction: column;
    gap: 16px;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: #c9a84c33; border-radius: 10px; }

  /* Welcome Screen */
  .welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; text-align: center; padding: 40px 20px;
    gap: 16px;
  }
  .welcome-orb {
    width: 80px; height: 80px; border-radius: 24px;
    background: linear-gradient(135deg, #c9a84c, #8a6a20);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 40px #c9a84c55, 0 0 80px #c9a84c22;
    animation: float3d 4s ease-in-out infinite;
    position: relative;
  }
  .welcome-orb::before {
    content: '';
    position: absolute; inset: -8px;
    border-radius: 32px;
    border: 1px solid #c9a84c33;
    animation: rotate 6s linear infinite;
  }
  .welcome-orb::after {
    content: '';
    position: absolute; inset: -16px;
    border-radius: 40px;
    border: 1px solid #c9a84c18;
    animation: rotate 10s linear infinite reverse;
  }
  .welcome-title {
    font-size: 26px; font-weight: 800;
    color: var(--gold-light); letter-spacing: 2px;
    text-shadow: 0 0 30px #c9a84c55;
  }
  .welcome-sub {
    font-size: 13px; color: var(--muted);
    line-height: 1.7; max-width: 280px;
  }
  .suggestions {
    display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center;
    margin-top: 8px;
  }
  .suggestion-btn {
    padding: 8px 14px; border-radius: 20px;
    border: 1px solid #c9a84c33;
    background: #c9a84c0a;
    color: var(--gold-light); font-size: 12px;
    font-family: 'Syne', sans-serif; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .suggestion-btn:hover { background: #c9a84c22; border-color: var(--gold); }

  /* Message Bubbles */
  .msg {
    display: flex; gap: 10px;
    animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; margin-top: 2px;
  }
  .msg.ai .msg-avatar {
    background: linear-gradient(135deg, #c9a84c, #8a6a20);
    box-shadow: 0 0 12px #c9a84c44;
  }
  .msg.user .msg-avatar {
    background: #1a2035;
    border: 1px solid var(--border);
  }
  .msg-bubble {
    max-width: 78%; padding: 12px 16px;
    font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.ai .msg-bubble {
    background: rgba(12,17,32,0.9);
    border: 1px solid #c9a84c22;
    border-radius: 4px 18px 18px 18px;
    color: var(--white);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 0 20px #c9a84c05;
    backdrop-filter: blur(10px);
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, #c9a84c, #a07830);
    border-radius: 18px 4px 18px 18px;
    color: #050810; font-weight: 600;
    box-shadow: 0 4px 20px #c9a84c44;
  }

  /* Typing */
  .typing-bubble {
    background: rgba(12,17,32,0.9);
    border: 1px solid #c9a84c22;
    border-radius: 4px 18px 18px 18px;
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold);
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  /* Input Area */
  .input-area {
    position: relative; z-index: 10;
    padding: 12px 16px 20px;
    background: rgba(5,8,16,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid #c9a84c18;
  }
  .input-box {
    display: flex; gap: 10px; align-items: flex-end;
    background: rgba(12,17,32,0.8);
    border: 1px solid #c9a84c33;
    border-radius: 16px;
    padding: 10px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(10px);
  }
  .input-box:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px #c9a84c18, 0 0 30px #c9a84c22;
  }
  textarea {
    flex: 1; background: transparent; border: none;
    color: var(--white); font-family: 'Syne', sans-serif;
    font-size: 14px; line-height: 1.5; resize: none;
    max-height: 100px; outline: none;
  }
  textarea::placeholder { color: var(--muted); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--gold);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 0 20px #c9a84c55;
  }
  .send-btn:hover { transform: scale(1.08); box-shadow: 0 0 30px #c9a84c77; }
  .send-btn:disabled { background: #2a3050; box-shadow: none; cursor: not-allowed; transform: none; }
  .input-hint {
    font-size: 10px; color: #3a4060; text-align: center;
    margin-top: 8px; letter-spacing: 0.5px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Animations */
  @keyframes iconPulse {
    0%,100% { box-shadow: 0 0 20px #c9a84c44, 0 0 40px #c9a84c22; }
    50% { box-shadow: 0 0 30px #c9a84c77, 0 0 60px #c9a84c44; }
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes float3d {
    0%,100% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
    33% { transform: translateY(-10px) rotateX(5deg) rotateY(5deg); }
    66% { transform: translateY(-5px) rotateX(-3deg) rotateY(-3deg); }
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(16px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes typingBounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn">←</a>
    <div class="oryn-badge">
      <div class="oryn-icon">✦</div>
      <div class="oryn-info">
        <div class="oryn-name">ORYN</div>
        <div class="oryn-status"><span class="status-dot"></span> Online & Ready</div>
      </div>
    </div>
  </div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#3a4060;letter-spacing:1px;">v1.0</div>
</div>

<!-- Mode Tabs -->
<div class="mode-tabs">
  <button class="mode-tab active" onclick="setMode('general', this)">💬 General</button>
  <button class="mode-tab" onclick="setMode('business', this)">🏢 Business</button>
  <button class="mode-tab" onclick="setMode('coding', this)">💻 Coding</button>
</div>

<!-- Messages -->
<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-orb">✦</div>
    <div class="welcome-title">ORYN</div>
    <div class="welcome-sub">Main hun tera AI partner. Business, coding, ya koi bhi sawaal — poocho bhai!</div>
    <div class="suggestions" id="suggestions">
      <button class="suggestion-btn" onclick="useSuggestion(this)">Marketing strategy kya hogi?</button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">Mera business grow kaise ho?</button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">Python code likhdo</button>
      <button class="suggestion-btn" onclick="useSuggestion(this)">AI kya hota hai?</button>
    </div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-box">
    <textarea id="input" rows="1" placeholder="Oryn se kuch bhi poocho..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="input-hint">ENTER = Send &nbsp;•&nbsp; SHIFT+ENTER = New line</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── 3D Background ───────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 5;

// Floating particles
const geo = new THREE.BufferGeometry();
const count = 120;
const positions = new Float32Array(count * 3);
for (let i = 0; i < count * 3; i++) {
  positions[i] = (Math.random() - 0.5) * 20;
}
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const mat = new THREE.PointsMaterial({
  color: 0xc9a84c,
  size: 0.05,
  transparent: true,
  opacity: 0.6,
});
const points = new THREE.Points(geo, mat);
scene.add(points);

// Wireframe icosahedron
const icoGeo = new THREE.IcosahedronGeometry(2, 1);
const icoMat = new THREE.MeshBasicMaterial({
  color: 0xc9a84c,
  wireframe: true,
  transparent: true,
  opacity: 0.06,
});
const ico = new THREE.Mesh(icoGeo, icoMat);
scene.add(ico);

// Ring
const ringGeo = new THREE.TorusGeometry(3, 0.008, 8, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.1 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 3;
scene.add(ring);

const ring2 = new THREE.Mesh(
  new THREE.TorusGeometry(2.2, 0.005, 8, 80),
  new THREE.MeshBasicMaterial({ color: 0xe8c97a, transparent: true, opacity: 0.07 })
);
ring2.rotation.x = -Math.PI / 4;
ring2.rotation.y = Math.PI / 6;
scene.add(ring2);

let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.005;
  points.rotation.y = t * 0.3;
  points.rotation.x = t * 0.1;
  ico.rotation.y = t * 0.2 + mouseX * 0.3;
  ico.rotation.x = t * 0.1 + mouseY * 0.2;
  ring.rotation.z = t * 0.15;
  ring2.rotation.z = -t * 0.1;
  camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.05;
  camera.position.y += (mouseY * 0.2 - camera.position.y) * 0.05;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Chat Logic ───────────────────────────────────────────
const MODES = {
  general: {
    system: "You are Oryn, a helpful and intelligent AI assistant. Be friendly, clear, and concise. You were created to help everyone.",
    suggestions: ["AI kya hota hai?", "Mujhe motivate karo", "Kal ka plan banao", "Koi interesting fact batao"]
  },
  business: {
    system: "You are Oryn, an expert business consultant AI. Help with strategy, marketing, finance, operations, and startups. Be practical and actionable. Give real advice.",
    suggestions: ["Marketing strategy kya hogi?", "Startup idea validate karo", "Pricing kaise set karein?", "Social media growth tips"]
  },
  coding: {
    system: "You are Oryn, an expert coding assistant. Help with code, debugging, and architecture. Always include working code examples with clear comments.",
    suggestions: ["Python mein hello world", "React component banao", "SQL query likhdo", "Bug fix karo"]
  }
};

let currentMode = 'general';
let history = [];
let isLoading = false;

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (history.length === 0) {
    updateSuggestions(mode);
  }
}

function updateSuggestions(mode) {
  const s = document.getElementById('suggestions');
  if (!s) return;
  s.innerHTML = MODES[mode].suggestions.map(t =>
    `<button class="suggestion-btn" onclick="useSuggestion(this)">${t}</button>`
  ).join('');
}

function useSuggestion(btn) {
  document.getElementById('input').value = btn.textContent;
  sendMessage();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function appendMsg(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'ai' ? '✦' : '👤'}</div>
    <div class="msg-bubble">${content}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function showTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar">✦</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  appendMsg('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: MODES[currentMode].system,
        messages: history,
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Maafi, kuch gadbad ho gayi. Dobara try karo!';

    document.getElementById('typing')?.remove();
    appendMsg('ai', reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    document.getElementById('typing')?.remove();
    appendMsg('ai', '❌ Connection error. Internet check karo aur dobara try karo.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
</script>
</body>
</html>
